# HA add-on 매니페스트. 필드 의미는 deploy/DOCKER.md·relay_config.rs 참조.
# options 가 /data/options.json 으로 그대로 떨어지고, relay 는 인자 없이 뜨면 그 파일이 있을 때
# 자동으로 읽는다(src/bin/relay.rs, 이미지에 CMD 없음) — options/schema 아래 필드명은 RelayConfig 구조체와 1:1.
# 이미지는 root 로 돎(HA 관례) — /data·/ssl/privkey.pem 이 root 소유라 비root 면 못 읽음(Dockerfile 참조).
name: "Zigbang Doorlock Relay"
version: "0.1.9"
slug: "zigbang_relay"
description: "직방(삼성SDS IHP) 도어락 de-cloud MQTTS+UDP 릴레이 — HA 재시작/업데이트와 무관하게 상시 동작"
url: "https://github.com/3735943886/zigbang_relay"
# zigbang_doorlock 통합의 "내장 relay"(PyPI zigbang-relay)는 HA 와 함께 시작·종료됨. HAOS 에선 HA core 와 별개
# 컨테이너로 도는 이 add-on 을 권장(통합은 "외부" 방식으로 이 add-on 의 observer 9883 에 연결).
arch:
  - aarch64
  - amd64
  - armv7
  - armhf

# 루트 Dockerfile(scratch, s6-overlay 없음)을 그대로 씀 — HA 자체 빌드가 아니라 사전빌드 이미지 pull.
# 이미지는 .github/workflows/binary-release.yml 의 docker-publish 잡이 v* 태그 푸시때 자동
# 빌드+푸시(Docker Hub) — relay 바이너리 크로스빌드를 재사용해서 Dockerfile 안에서 다시 컴파일 안 함.
# version 필드를 올릴 땐 반드시 같은 값으로 git tag(vX.Y.Z) 도 찍을 것 — 태그=버전이 곧 pull될 이미지.
image: "3735943886/zigbang-relay"
init: false

startup: services
boot: auto
host_network: false

# HA 표준 인증서 공유경로. 커뮤니티 "Let's Encrypt" add-on 등이 여기에 fullchain.pem/privkey.pem
# 을 떨궈주면(HAOS 관례) 우리는 읽기전용으로 가져다 씀 — options.cert_file/cert_key 기본값 참조.
map:
  - "ssl:ro"

# 9883(관찰자)은 일부러 host 로 안 열어줌 — HA 내부 도커망에서 add-on 호스트명으로만 접근
# (zigbang_doorlock 통합 "외부" 방식이 <호스트명>:9883 으로 붙음, DOCS §6). 외부 노출 필요하면 직접 추가할 것
# (그럴 땐 options.observer_user/observer_pass 로 인증도 같이 켤 것 — 기본은 무인증).
ports:
  18883/tcp: 18883
  5683/udp: 5683
ports_description:
  18883/tcp: "MQTTS — 도어락이 실제 접속하는 포트(주입 serviceUrl 이 이 호스트:포트를 가리켜야 함)"
  5683/udp: "UDP holepunch"

options:
  log_level: "info"
  observer: "0.0.0.0:9883"
  observer_user: ""   # 둘 다 채워야 관찰자 인증 활성화(기본은 빈 문자열=무인증, ports 를 직접
  observer_pass: ""   # 열어서 host 로 노출할 때만 채우는 걸 권장 — 컨테이너망 안에서만 쓰면 불필요).
  rules_file: "rules"
  replay_store: "state/replay.json"
  log_dir: "logs"
  upstream_insecure: true
  cert_file: "/ssl/fullchain.pem"   # Let's Encrypt add-on 등이 채워주는 HA 표준 경로(map: ssl:ro)
  cert_key: "/ssl/privkey.pem"
  cert_name: "relay.example.com"
  answered_ttl_secs: 120
  answered_cap: 8192
  reconnect_secs: 15
  route:
    - name: "mqtts"
      proto: "mqtts"
      mode: "proxy"
      listen: "0.0.0.0:18883"
      upstream: "broker.vendor.example:8883"
    - name: "holepunch"
      proto: "udp"
      mode: "proxy"
      listen: "0.0.0.0:5683"
      upstream: "brokerudp.vendor.example:5683"

schema:
  log_level: "list(error|warn|info|debug|trace)"
  observer: "str?"
  observer_user: "str?"
  observer_pass: "password?"
  rules_file: "str"
  replay_store: "str"
  log_dir: "str"
  upstream_insecure: "bool"
  cert_file: "str"
  cert_key: "str"
  cert_name: "str?"
  answered_ttl_secs: "int"
  answered_cap: "int"
  reconnect_secs: "int"
  route:
    - name: "str"
      proto: "list(mqtts|udp|tcp)"
      mode: "list(proxy|shadow|decloud)"
      listen: "str"
      upstream: "str?"
